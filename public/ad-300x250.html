    #ad-container {

    }
  </style>
</head>
<body>
  <div id="ad-container">
    <script type="text/javascript">
      atOptions = {
        'key' : 'dadc3184f70b3e4ec47ba368b8321549',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="https://bicea.org/22/dadc3184f70b3e4ec47ba368b8321549" onerror="showFallback()"></script>

  <div id="fallback-container">

    <div style="font-size: 9px; color: #999;">Disable Brave Shields / AdBlock to load dynamic ads</div>
  </div>

  <script>
    function showFallback() {
      var ad = document.getElementById('ad-container');
      var fb = document.getElementById('fallback-container');
      if (ad && fb) {
        ad.style.display = 'none';
        fb.style.display = 'flex';
      }
    }
    // Safety check: if script was blocked by client after generous allowance
    setTimeout(function() {
      var ad = document.getElementById('ad-container');
      var hasContent = ad && (ad.querySelector('iframe') || ad.querySelector('img') || ad.querySelector('a') || ad.childElementCount > 2);
      if (!hasContent) {
        showFallback();
      }
    }, 4500);
  </script>
